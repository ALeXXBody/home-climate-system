; Standalone recovery image for ESP32-C3 boards that bootloop.
; Completely separate from the main firmware — build with:
;   pio run -d firmware/recovery -t upload
;   pio device monitor -d firmware/recovery -b 115200
[platformio]
default_envs = lolin_c3_recovery

[env:lolin_c3_recovery]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
