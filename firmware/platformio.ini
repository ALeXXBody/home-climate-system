; Home Climate System firmware
; Targets: ESP8266 D1 mini (DIYLess Master OT shield stack)
;           ESP32-S3-Zero (DIYLess Master OT via jumper wires)
;
; Build:  cd firmware && pio run -e d1_mini
; Flash:  pio run -e d1_mini -t upload
; Monitor: pio device monitor -b 115200

[platformio]
default_envs = d1_mini
src_dir = src
include_dir = include

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
    ihormelnyk/OpenTherm Library@^1.1.5
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DHCS_FW_VERSION=\"0.1.0\"

; ---------- ESP8266 WeMos D1 mini + DIYLess Master OpenTherm Shield (stacked) ----------
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DHCS_BOARD_D1_MINI
    -DOT_IN_PIN=4
    -DOT_OUT_PIN=5
    ; D2 = GPIO4 (OT in), D1 = GPIO5 (OT out) — DIYLESS default for ESP8266

; ---------- ESP32 classic (Wemos D1 mini ESP32 form factor, DIYLESS defaults) ----------
[env:esp32_d1_mini]
platform = espressif32
board = wemos_d1_mini32
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DHCS_BOARD_ESP32_D1
    -DOT_IN_PIN=21
    -DOT_OUT_PIN=22

; ---------- Waveshare / generic ESP32-S3-Zero (jumper to DIYLess Master shield) ----------
[env:esp32s3_zero]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DHCS_BOARD_ESP32S3_ZERO
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DOT_IN_PIN=5
    -DOT_OUT_PIN=6
    ; Wire shield OT_IN  -> GPIO5, OT_OUT -> GPIO6 (see docs/hardware.md)
    ; Status RGB on ESP32-S3-Zero is often GPIO21 (WS2812) — not used yet
