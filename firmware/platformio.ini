; Home Climate System firmware
; Primary targets: ESP8266 D1 mini | LOLIN/Wemos S2 mini (D1-mini layout,
; stacks/wires onto DIYLess Master OpenTherm Shield like the ESP8266).
; Extra targets: ESP32 classic D1 mini form-factor | ESP32-S3-Zero
;
; Build:   cd firmware && pio run -e d1_mini
; Flash:   pio run -e d1_mini -t upload
; Monitor: pio device monitor -b 115200

[platformio]
default_envs = d1_mini
src_dir = src
include_dir = include

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
    ihormelnyk/OpenTherm Library@^1.1.5
    tzapu/WiFiManager@^2.0.17
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.3
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=0

; ---------- Wokwi headless simulation (HCS_TEST_BOOT) ----------
[env:esp32_test]
extends = esp32_d1_mini
platform = espressif32
board = wemos_d1_mini32
framework = arduino
lib_deps = ${common.lib_deps}
build_flags =
    ${env:esp32_d1_mini.build_flags}
    -DHCS_TEST_BOOT

; ---------- Host-native unit tests (pio test -e native) ----------
[env:native]
platform = native
test_framework = unity
build_flags =
    -Iinclude

; ---------- ESP8266 WeMos D1 mini + DIYLess Master OpenTherm Shield ----------
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DHCS_BOARD_D1_MINI
    -DHCS_BOARD_NAME=\"d1_mini\"
    -DOT_IN_PIN=4
    -DOT_OUT_PIN=5
    ; Diagnostic LED: onboard D4 LED (GPIO2, active-LOW; strap-safe).
    -DHCS_STATUS_LED_PIN=2
    -DHCS_STATUS_LED_ACTIVE_LOW
    -DHCS_ONEWIRE_PIN=14
board_build.filesystem = littlefs


; ---------- ESP32 classic (Wemos D1 mini ESP32 form factor) ----------


[env:esp32_d1_mini]
platform = espressif32
board = wemos_d1_mini32
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DHCS_BOARD_ESP32_D1
    -DHCS_BOARD_NAME=\"esp32_d1_mini\"
    -DOT_IN_PIN=21
    -DOT_OUT_PIN=22
    ; Diagnostic LED: onboard blue LED (GPIO2, active-HIGH — opposite of 8266).
    -DHCS_STATUS_LED_PIN=2

; ---------- ESP32-S2: LOLIN/Wemos S2 mini (same D1-mini layout family) ----------
; Same wiring convention as the ESP8266 shield stack: OT_IN=GPIO4, OT_OUT=GPIO5.
; GPIO33-37 are reserved by the embedded flash on the S2FH4 — avoid them.
; Native USB serial via CDC (no FTDI chip on this board).
    -DHCS_ONEWIRE_PIN=18


[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DHCS_BOARD_LOLIN_S2_MINI
    -DHCS_BOARD_NAME=\"lolin_s2_mini\"
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DOT_IN_PIN=4
    -DOT_OUT_PIN=5
    ; Diagnostic LED: onboard LED1 (GPIO15, active-LOW per schematic).
    -DHCS_STATUS_LED_PIN=15
    -DHCS_STATUS_LED_ACTIVE_LOW

; ---------- ESP32-S3: Waveshare / generic ESP32-S3-Zero (kept as extra target) ----------
    -DHCS_ONEWIRE_PIN=15


[env:esp32s3_zero]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DHCS_BOARD_ESP32S3_ZERO
    -DHCS_BOARD_NAME=\"esp32s3_zero\"
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DOT_IN_PIN=5
    -DOT_OUT_PIN=6
    -DHCS_ONEWIRE_PIN=1
    ; Diagnostic LED: onboard WS2812 (GPIO48).
    -DHCS_STATUS_LED_PIN=48
    ; WS2812/RMT disabled — same neopixelWrite abort risk as C3
    -DHCS_STATUS_LED_DISABLE


[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DHCS_BOARD_LOLIN_C3_MINI
    -DHCS_BOARD_NAME=\"lolin_c3_mini\"
    ; Stacks directly on the DIYLess Master OT shield (D1-mini footprint).
    ; Verified against Wemos schematics (d1_mini v4.0 vs c3_mini v2.1.0):
    ; the C3 right header is TX,RX,IO10,IO8,IO7,IO6,GND,5V — so the shield's
    ; D2 pad (OT_IN) lands on GPIO8 and its D1 pad (OT_OUT) on GPIO10.
    ; (GPIO7/GPIO6 are the D3/D4 pads — NOT wired to the shield's OT front-end.)
    -DOT_IN_PIN=8
    -DOT_OUT_PIN=10
    ; 1-Wire on the D5-position pad (GPIO1) — same physical pad as ESP8266 D5.
    -DHCS_ONEWIRE_PIN=1
    ; Onboard LED is WS2812 on GPIO7. Arduino neopixelWrite() uses RMT and
    ; abort()s on C3 during boot (see panic: rmt_driver_install). Disable.
    -DHCS_STATUS_LED_DISABLE

; ===========================================================================
; Gateway builds (ESP32 only — ESP8266 stays master-only/basic).
; Add a second (thermostat-side) OT front-end on OT2 pins; see
; docs/design-gateway.md.
; ===========================================================================

[env:lolin_s2_mini_gw]
extends = lolin_s2_mini
platform = espressif32
board = lolin_s2_mini
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${env:lolin_s2_mini.build_flags}
    -DHCS_GW_ENABLE
    -DOT2_IN_PIN=16
    -DOT2_OUT_PIN=17

[env:esp32_d1_mini_gw]
extends = esp32_d1_mini
platform = espressif32
board = wemos_d1_mini32
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${env:esp32_d1_mini.build_flags}
    -DHCS_GW_ENABLE
    -DOT2_IN_PIN=26
    -DOT2_OUT_PIN=27

[env:lolin_c3_mini_gw]
extends = lolin_c3_mini
platform = espressif32
board = lolin_c3_mini
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${env:lolin_c3_mini.build_flags}
    -DHCS_GW_ENABLE
    ; thermostat-side front-end (OT-Direct piggyback) on free GPIO4/GPIO5
    -DOT2_IN_PIN=4
    -DOT2_OUT_PIN=5
