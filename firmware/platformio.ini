; Placeholder — real firmware lands in a later commit.
; PlatformIO project will target esp32dev and esp12e (ESP8266).

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

[env:esp8266]
platform = espressif8266
board = esp12e
framework = arduino
