name: firmware

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - d1_mini
          - esp32_d1_mini
          - lolin_s2_mini
          - esp32s3_zero
          - lolin_c3_mini
          - lolin_s2_mini_gw
          - esp32_d1_mini_gw
          - lolin_c3_mini_gw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.env }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}

      - name: Verify embedded version matches tag (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: firmware
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Expecting version string: $VER"
          strings -a .pio/build/${{ matrix.env }}/firmware.bin | grep -qx "$VER" \
            || { echo "::error::binary does not embed version '$VER' — was include/config.h bumped?"; exit 1; }
          # Reject known-stale older versions leaking into the build
          if strings -a .pio/build/${{ matrix.env }}/firmware.bin | grep -qE '^1\.3\.[0-5]$'; then
            echo "::error::stale version string found alongside '$VER'"; exit 1
          fi

      - name: Image size budget (per-env OTA slot reality; see platformio.ini)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: firmware
        run: |
          # d1_mini (ESP8266): stock 4 MB slot headroom.
          # esp32_d1_mini(+gw): OTA-updatable fleet — must fit the stock
          #   1310720 B OTA slot, because OTA cannot rewrite the partition
          #   table; deployed boards still run the stock one.
          # All other envs: not yet deployed → first flash is USB with the
          #   enlarged table (app slots 1441792 B), so their budget is that.
          case "${{ matrix.env }}" in
            d1_mini) LIMIT=980000 ;;
            esp32_d1_mini|esp32_d1_mini_gw) LIMIT=1310720 ;;
            *) LIMIT=1441792 ;;
          esac
          SIZE=$(stat -c%s .pio/build/${{ matrix.env }}/firmware.bin)
          echo "${{ matrix.env }}: $SIZE bytes (limit $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::image $SIZE B exceeds the ${{ matrix.env }} OTA budget $LIMIT B — shrink the build instead of shipping an update boards cannot install"
            exit 1
          fi

      - name: Rename artifact for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp firmware/.pio/build/${{ matrix.env }}/firmware.bin firmware-${{ matrix.env }}.bin

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: firmware-${{ matrix.env }}
          path: firmware-${{ matrix.env }}.bin
          retention-days: 3

  release:
    name: Attach assets to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Sign all firmware images (ESP32 + ESP8266)
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -e
          pip install -q cryptography
          # v1.5.23: the ESP8266 board also verifies ECDSA on-device now, so
          # every image ships signed; boards REFUSE an unsigned sibling.
          for f in assets/*.bin; do
            python3 scripts/sign_firmware.py sign "$f"
          done
          ls -la assets/

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets/
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft=false --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" assets/*.bin assets/*.bin.sig --clobber
