name: firmware

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - d1_mini
          - esp32_d1_mini
          - lolin_s2_mini
          - esp32s3_zero
          - lolin_c3_mini
          - lolin_s2_mini_gw
          - esp32_d1_mini_gw
          - lolin_c3_mini_gw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.env }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}

      - name: Verify embedded version matches tag (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: firmware
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Expecting version string: $VER"
          strings -a .pio/build/${{ matrix.env }}/firmware.bin | grep -qx "$VER" \
            || { echo "::error::binary does not embed version '$VER' — was include/config.h bumped?"; exit 1; }
          # Reject known-stale older versions leaking into the build
          if strings -a .pio/build/${{ matrix.env }}/firmware.bin | grep -qE '^1\.3\.[0-5]$'; then
            echo "::error::stale version string found alongside '$VER'"; exit 1
          fi

      - name: Rename artifact for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp firmware/.pio/build/${{ matrix.env }}/firmware.bin firmware-${{ matrix.env }}.bin

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: firmware-${{ matrix.env }}
          path: firmware-${{ matrix.env }}.bin
          retention-days: 3

  release:
    name: Attach assets to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets/
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft=false --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" assets/*.bin --clobber
